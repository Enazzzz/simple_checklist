name: Build Executable

on:
  # Only build on releases, not every push
  release:
    types: [published]
  # Uncomment the lines below if you want automatic builds
  # push:
  #   branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        python -m PyInstaller checklist.spec
        if (Test-Path "dist/checklist.exe") { Write-Host "Build successful!" } else { exit 1 }
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: checklist-executable
        path: dist/checklist.exe 